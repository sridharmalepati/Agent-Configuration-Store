[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qa-automation-fastapi-service"
version = "0.1.0"
description = "Standalone FastAPI service for QA_Automation CRUD with soft delete"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.1",
    "alembic>=1.13.2",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[project.scripts]
qa-automation-service = "repo_service.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_service"]
